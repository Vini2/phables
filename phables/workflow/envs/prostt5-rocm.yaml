name: prostt5-rocm
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - pip
  - pip:
    # Unlike CUDA, ROCm is never the default pip torch build -- this index
    # override is required, not just for reproducibility.
    - --extra-index-url https://download.pytorch.org/whl/rocm6.3
    # torch==2.9.1+rocm6.3 pinned exactly, not just floored. Confirmed real on
    # https://download.pytorch.org/whl/rocm6.3/torch/ (wheels for cp310-cp314,
    # so every Python the `python>=3.10` pin above can resolve is covered --
    # 2.9.1 drops the cp39 wheel 2.7.1 had, which that pin already excludes).
    #
    # This env is the ONLY torch the workflow uses on ROCm, in both ways of
    # running it. container/Dockerfile builds on Pawsey's ROCm base
    # (quay.io/pawsey/pytorch:2.7.1-rocm6.3.3) for its ROCm userspace, but
    # pre-builds THIS env inside the image and leaves the base's own
    # system-python torch 2.7.1 untouched and unused -- so predict_3di runs on
    # 2.9.1+rocm6.3 whether or not you're in the container. Keep it that way:
    # the base image's torch version is an implementation detail of the base,
    # not a version this workflow is pinned to.
    #
    # Phables drives ProstT5 through a plain conda env rather than pointing
    # rules at a prebuilt torch container, after repeatedly hitting
    # container-specific problems on Setonix that had nothing to do with
    # phables/pholdlib itself: a broken torchaudio needing libomp.so, --home
    # overriding the container's apparent CWD so relative output paths
    # silently resolved to the wrong place, and a missing MIOpen AI-heuristic
    # kernel-selection file for gfx90a. All real, all diagnosed, none of them
    # things a conda env is exposed to.
    # >=2.6 would already avoid transformers' checkpoint loader refusing
    # torch.load() on older torch outright (CVE-2025-32434 hardening in
    # check_torch_load_is_safe, which broke loading Rostlab/ProstT5_fp16 -- no
    # safetensors file); pinning exactly goes further, keeping the version
    # deterministic across every array task rather than drifting as new
    # releases land mid-run.
    - torch==2.9.1
    - pholdlib>=0.1.2
