# Snakemake config
input:
output: 'phables.out/'
log: 'phables/phables.log'

# Databases 
databases:

# Profile
profile: 

# Job resources for use with Snakemake profiles
  # jobCPU will be scaled down if running locally with less than 8 threads
  # jobMem is ignored when running locally
resources:
  jobCPU: 8
  jobMem: 16000       # in Mb

# Phable parameters
minlength: 2000
mincov: 10
compcount: 200
maxpaths: 10
mgfrac: 0.2
genecaller: pyrodigal-gv
evalue: 1E-10
seqidentity: 0.3
covtol: 100
alpha: 1.2
longreads: False
prefix:

# Align resolved genomes + build a phylogenetic tree (MAFFT + piqtree/IQ-TREE).
# Off by default -- slow at metagenome scale (thousands of genomes); run
# phylogenetics separately on resolved_paths.fasta instead unless a per-run
# tree is specifically needed.
build_tree: False

# Phage-gene detection: mmseqs (PHROGs, default) or prostt5-foldseek (structural,
# see notes/phables_audit.md section 4d in the parent project for the full design).
# The prostt5-foldseek path needs a prebuilt hallmark structure DB and a ProstT5 CNN
# checkpoint -- neither is auto-downloaded yet, so both must be supplied explicitly
# when selecting this path.
phagedetection: mmseqs
hallmark_db:
hallmark_categories:
hallmark_evalue: 1E-8
hallmark_minbits: 0
prostt5_checkpoint:
prostt5_model: Rostlab/ProstT5_fp16
prostt5_model_dir:
prostt5_half_precision: True
prostt5_cpu: False
# Which PyTorch build predict_3di's conda env solves: cpu, cuda, or rocm (e.g.
# Setonix's MI250X nodes). Independent of prostt5_cpu above, which forces
# ProstT5 onto the CPU device at *runtime* even inside a GPU-capable env --
# gpu_backend controls which env gets *built*. foldseek_gpu (below) is
# separate again: foldseek's own --gpu mode is CUDA-only, so it stays off
# regardless of gpu_backend unless explicitly requested and gpu_backend=cuda.
#
# A fourth value, `system`, means "don't build an env for predict_3di at all;
# torch and pholdlib are already installed in the ambient python". Conda envs
# are isolated, so a rule with a conda: directive can never see a torch that
# lives outside its env -- `system` is the only way to REUSE an existing,
# known-good GPU torch instead of installing a second one. That's exactly the
# situation inside container/Dockerfile, whose ROCm base image already ships a
# working torch, and it's also how you'd use a module-loaded torch on HPC.
# Note this key cannot be usefully overridden by editing a config file: the
# CLI hands every option to snaketool as merge_config=kwargs, so
# --gpu-backend's click default ("cpu") is merged OVER whatever is written
# here. Pass --gpu-backend on the command line instead. (Learned the hard way
# by baking `system` into the container's config and watching runs still use
# cpu -- see container/Dockerfile.)
gpu_backend: cpu
foldseek_gpu: False
# Worker processes for the flow-decomposition step. Components are independent
# of each other (no component's logic reads another's results), so they are
# chunked across processes and merged in component order -- output is identical
# to mfd_workers: 1, genome numbering included. Separate from `threads`: the
# MILP solver gains nothing measurable from extra threads because building the
# model, not solving it, dominates -- so concurrency has to come from running
# components side by side instead.
mfd_workers: 1
# Batch limits are device-specific -- the defaults are conservative CPU/laptop-MPS
# values, not tuned for any particular GPU. Retune per device (phold's autotune.py
# is the reference approach) rather than trusting these at scale.
prostt5_max_residues: 4000
prostt5_max_seq_len: 4000
prostt5_max_batch: 20